name: Backfill historical data

on:
    workflow_dispatch:
        inputs:
            fresh:
                description: "Bypass HTTP cache and fetch fresh responses"
                type: boolean
                default: false

env:
    DB_PATH: data/coffee.db
    ARTIFACT_NAME: coffee-db

# Must use the same group as scrape.yml so a manual backfill can't race a
# scheduled live run and overwrite the shared DB artifact.
concurrency:
    group: coffee-db-artifact
    cancel-in-progress: false

jobs:
    test:
        uses: ./.github/workflows/test.yml

    backfill:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
            - name: Set up uv
              uses: astral-sh/setup-uv@v10.0.1
            - name: Find latest coffee-db artifact run id
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  run_id=$(gh api \
                    "repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=1" \
                    --jq '.artifacts[0].workflow_run.id // empty')

                  if [[ -n "$run_id" ]]; then
                    echo "Found previous artifact run id: $run_id"
                    echo "artifact_run_id=$run_id" >> "$GITHUB_ENV"
                  else
                    echo "No previous coffee-db artifact found. Starting from a new database."
                  fi
            - name: Download previous database artifact
              if: ${{ env.artifact_run_id != '' }}
              uses: actions/download-artifact@v8
              with:
                  name: ${{ env.ARTIFACT_NAME }}
                  path: data/
                  run-id: ${{ env.artifact_run_id }}
                  github-token: ${{ github.token }}
            - name: Install dependencies
              run: uv sync
            - name: Backfill historical Wayback snapshots
              run: |
                  set -euo pipefail
                  uv run coffeedb init --db "$DB_PATH"
                  uv run coffeedb scrape historical --db "$DB_PATH" ${{ inputs.fresh && '--fresh' || '' }}
            - name: Validate DB row count
              run: |
                  set -euo pipefail
                  if [ ! -f "$DB_PATH" ]; then
                    echo "ERROR: $DB_PATH does not exist."
                    exit 1
                  fi
                  INTEGRITY=$(sqlite3 "$DB_PATH" "PRAGMA integrity_check;")
                  if [ "$INTEGRITY" != "ok" ]; then
                    echo "ERROR: SQLite integrity check failed: $INTEGRITY"
                    exit 1
                  fi
                  COUNT=$(sqlite3 "$DB_PATH" "SELECT COUNT(*) FROM snapshots;")
                  echo "Snapshot count: $COUNT"
                  if [ "$COUNT" -lt 1 ]; then
                    echo "ERROR: No snapshots found in DB. Aborting."
                    exit 1
                  fi
            - name: Upload database artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ env.ARTIFACT_NAME }}
                  path: ${{ env.DB_PATH }}
                  if-no-files-found: error
                  retention-days: 90
