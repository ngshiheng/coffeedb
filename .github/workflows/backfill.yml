name: Backfill historical data

on:
    workflow_dispatch:
        inputs:
            fresh:
                description: "Bypass HTTP cache and fetch fresh responses"
                type: boolean
                default: false

# Must use the same group as scrape.yml so a manual backfill can't race a
# scheduled live run and overwrite the shared DB artifact.
concurrency:
    group: coffee-db-artifact
    cancel-in-progress: false

jobs:
    backfill:
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
        steps:
            - uses: actions/checkout@v6
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
            - name: Set up uv
              uses: astral-sh/setup-uv@v6
            - name: Find latest coffee-db artifact run id
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  run_id=$(gh api \
                    "repos/${{ github.repository }}/actions/artifacts?name=coffee-db&per_page=1" \
                    --jq '.artifacts[0].workflow_run.id // empty')

                  if [[ -n "$run_id" ]]; then
                    echo "Found previous artifact run id: $run_id"
                    echo "artifact_run_id=$run_id" >> "$GITHUB_ENV"
                  else
                    echo "No previous coffee-db artifact found. Starting from a new database."
                  fi
            - name: Download previous database artifact
              uses: actions/download-artifact@v4
              with:
                  name: coffee-db
                  path: data/
                  run-id: ${{ env.artifact_run_id }}
                  github-token: ${{ github.token }}
              continue-on-error: true
            - name: Install dependencies
              run: uv sync
            - name: Backfill historical Wayback snapshots
              run: |
                  uv run coffeedb init --db data/coffee.db
                  uv run coffeedb scrape historical --db data/coffee.db ${{ inputs.fresh && '--fresh' || '' }}
            - name: Validate DB row count
              run: |
                  COUNT=$(sqlite3 data/coffee.db "SELECT COUNT(*) FROM snapshots;")
                  echo "Snapshot count: $COUNT"
                  if [ "$COUNT" -lt 1 ]; then
                    echo "ERROR: No snapshots found in DB. Aborting."
                    exit 1
                  fi
            - name: Upload database artifact
              uses: actions/upload-artifact@v4
              with:
                  name: coffee-db
                  path: data/coffee.db
                  if-no-files-found: error
                  retention-days: 90
