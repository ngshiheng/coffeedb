name: Scrape latest data

on:
    schedule:
        - cron: "0 0 * * 0"

    workflow_dispatch:

concurrency:
    group: coffee-db-artifact
    cancel-in-progress: false

jobs:
    test:
        uses: ./.github/workflows/test.yml

    scrape:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
        steps:
            - uses: actions/checkout@v6
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
            - name: Set up uv
              uses: astral-sh/setup-uv@v8.1.0
            - name: Find latest coffeedb artifact run id
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  run_id=$(gh api \
                    "repos/${{ github.repository }}/actions/artifacts?name=coffee-db&per_page=1" \
                    --jq '.artifacts[0].workflow_run.id // empty')

                  if [[ -n "$run_id" ]]; then
                    echo "Found previous artifact run id: $run_id"
                    echo "artifact_run_id=$run_id" >> "$GITHUB_ENV"
                  else
                    echo "No previous coffee-db artifact found. Starting from a new database."
                  fi
            - name: Download previous database artifact
              uses: actions/download-artifact@v8
              with:
                  name: coffee-db
                  path: data/
                  run-id: ${{ env.artifact_run_id }}
                  github-token: ${{ github.token }}
              continue-on-error: true
            - name: Install dependencies
              run: uv sync
            - name: Scrape live ranking data
              run: |
                  uv run coffeedb init --db data/coffee.db
                  uv run coffeedb scrape live --db data/coffee.db
            - name: Cleanup empty and sparse details
              run: |
                  bash scripts/cleanup-empty-details.sh data/coffee.db
                  bash scripts/repair-sparse-details.sh data/coffee.db
            - name: Validate DB row count
              run: |
                  COUNT=$(sqlite3 data/coffee.db "SELECT COUNT(*) FROM shops;")
                  echo "Row count: $COUNT"
                  if [ "$COUNT" -lt 10 ]; then
                    echo "ERROR: Row count $COUNT is below threshold. Aborting."
                    exit 1
                  fi
            - name: Upload database artifact
              uses: actions/upload-artifact@v7
              with:
                  name: coffee-db
                  path: data/coffee.db
                  if-no-files-found: error
                  retention-days: 90
