[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coffeedb"]

[project]
name = "coffeedb"
version = "0.1.0"
description = "Scrape and query the World's 100 Best Coffee Shops — live and historical."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hishel>=1.1.9",
    "httpx>=0.28.1",
    "parsel>=1.9.1",
    "typer>=0.15.0",
]

[project.optional-dependencies]
test = ["hypothesis>=6.142.0", "pytest>=8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
coffeedb = "coffeedb.cli:app"
